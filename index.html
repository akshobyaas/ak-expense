<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Ixora" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Ixora</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0d0d; --raise: #161616; --raise-2: #202020;
      --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.12);
      --text: #f3f2ef; --text-2: #b4b2ad; --muted: #7c7a75;
      --accent: #ff6a3d; --accent-ink: #1c0b04;
      --good: #7fd49b; --warn: #f2c14e; --bad: #ff7a70;
      --font: "Geist", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
      --safe-b: env(safe-area-inset-bottom, 0px);
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 var(--font); -webkit-font-smoothing: antialiased; min-height: 100dvh; }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }
    .num { font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); } .t2 { color: var(--text-2); }

    main { max-width: 620px; margin: 0 auto; padding: 22px 20px calc(110px + var(--safe-b)); }
    .view { animation: in .22s ease-out; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

    /* header */
    .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
    .head h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.03em; }
    .head p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--raise-2); display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: .02em; }
    .back { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; color: var(--muted); padding: 6px 0; margin: -6px 0 18px; cursor: pointer; font-size: 15px; }
    .back:hover { color: var(--text); }

    /* hero */
    .hero { margin: 0 0 8px; }
    .hero .k { font-size: 15px; color: var(--text-2); }
    .hero .big { font-size: clamp(46px, 14vw, 64px); font-weight: 600; letter-spacing: -.045em; line-height: 1; margin: 8px 0 12px; }
    .hero .big small { font-size: .4em; color: var(--muted); letter-spacing: 0; font-weight: 500; }
    .hero .sub { font-size: 15px; color: var(--text-2); }
    .hero .sub b { color: var(--text); font-weight: 600; }
    .note { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--text-2); background: var(--raise); border-radius: 14px; padding: 12px 14px; margin-top: 18px; }
    .note b { color: var(--warn); font-weight: 600; }

    /* sections */
    h2.sec { font-size: 15px; font-weight: 600; margin: 34px 0 6px; display: flex; justify-content: space-between; align-items: baseline; letter-spacing: -.01em; }
    h2.sec a { font-size: 14px; font-weight: 400; color: var(--muted); }
    h2.sec a:hover { color: var(--text); }
    .sentence { font-size: 15px; color: var(--text-2); margin: 8px 0 0; }
    .sentence b { color: var(--text); font-weight: 600; }

    /* list rows */
    .list { display: flex; flex-direction: column; }
    .item { display: grid; grid-template-columns: 38px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .item:last-child { border-bottom: 0; }
    .item:active { opacity: .7; }
    .ico { width: 38px; height: 38px; border-radius: 12px; background: var(--raise-2); display: grid; place-items: center; color: var(--text-2); }
    .ico svg { width: 19px; height: 19px; }
    .item .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .sub { font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .amt { font-weight: 500; text-align: right; }
    .item .amt small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
    .item.off .name, .item.off .amt { color: var(--muted); }
    .strike { text-decoration: line-through; }
    .group { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 22px 0 4px; border-bottom: 1px solid var(--line); }

    /* category breakdown */
    .cat { display: grid; grid-template-columns: 38px minmax(0,1fr) 92px; gap: 14px; align-items: center; padding: 10px 0; }
    .cat .bar { height: 3px; border-radius: 2px; background: var(--raise-2); margin-top: 7px; overflow: hidden; }
    .cat .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
    .cat .pct { font-size: 13px; color: var(--muted); margin-left: 6px; }
    .cat > .num { text-align: right; }

    /* controls */
    .search { display: flex; align-items: center; gap: 10px; background: var(--raise); border-radius: 14px; padding: 0 14px; height: 46px; margin-bottom: 12px; }
    .search input { flex: 1; background: none; border: 0; outline: 0; min-width: 0; font-size: 16px; }
    .search svg { color: var(--muted); flex: none; }
    .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px 4px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--raise); color: var(--text-2); font-size: 14px; cursor: pointer; }
    .chip.on { background: var(--text); color: var(--bg); font-weight: 600; }
    .btn { height: 50px; padding: 0 20px; border-radius: 14px; border: 0; background: var(--raise-2); color: var(--text); font-size: 16px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
    .btn.danger { background: transparent; color: var(--bad); }
    .btn.block { width: 100%; }
    .btn.sm { height: 38px; font-size: 14px; padding: 0 14px; border-radius: 11px; }
    .btn:active { transform: scale(.98); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* form */
    .form { display: grid; gap: 20px; grid-template-columns: minmax(0,1fr); }
    .amount-in { display: flex; align-items: baseline; gap: 4px; border-bottom: 1px solid var(--line-2); padding-bottom: 8px; }
    .amount-in span { font-size: 40px; font-weight: 500; color: var(--muted); }
    .amount-in input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: 48px; font-weight: 600; letter-spacing: -.04em; padding: 0; }
    .field { display: grid; gap: 7px; }
    .field > span { font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; }
    .input { width: 100%; height: 50px; padding: 0 14px; border-radius: 14px; background: var(--raise); border: 1px solid transparent; outline: 0; font-size: 16px; -webkit-appearance: none; appearance: none; }
    .input:focus { border-color: var(--line-2); }
    .linkbtn { background: none; border: 0; color: var(--muted); font-size: 14px; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
    .seg { display: flex; background: var(--raise); border-radius: 14px; padding: 4px; }
    .seg button { flex: 1; border: 0; background: none; height: 42px; border-radius: 11px; color: var(--muted); font-size: 15px; cursor: pointer; }
    .seg button.on { background: var(--raise-2); color: var(--text); }
    .warn-card { background: var(--raise); border-radius: 16px; padding: 16px; display: grid; gap: 12px; animation: in .2s; }
    .warn-card p { margin: 0; font-size: 15px; color: var(--text-2); }
    .warn-card p b { color: var(--text); }

    /* detail */
    .d-top { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
    .d-top .ico { width: 46px; height: 46px; border-radius: 14px; }
    .d-name { font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin: 0; line-height: 1.2; }
    .d-meta { font-size: 14px; color: var(--muted); margin-top: 2px; }
    .d-amt { font-size: 48px; font-weight: 600; letter-spacing: -.04em; margin: 8px 0 6px; }
    .d-notes { font-size: 15px; color: var(--text-2); margin: 14px 0 0; }
    .d-actions { display: grid; gap: 8px; margin-top: 34px; }

    /* charts */
    .chart { position: relative; margin-top: 12px; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .tip { position: absolute; pointer-events: none; background: var(--raise-2); border-radius: 10px; padding: 7px 10px; font-size: 13px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); opacity: 0; transition: opacity .1s; }
    .tip b { display: block; font-size: 14px; }
    .empty { color: var(--muted); padding: 30px 0; text-align: center; font-size: 15px; }

    /* bottom bar */
    .bar-nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + var(--safe-b)); z-index: 30; display: flex; align-items: center; gap: 4px; background: rgba(30,30,30,.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 22px; padding: 6px; box-shadow: 0 12px 30px -10px rgba(0,0,0,.8); }
    .bar-nav a { height: 46px; min-width: 64px; padding: 0 14px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; font-weight: 500; }
    .bar-nav a.on { color: var(--text); background: rgba(255,255,255,.07); }
    .bar-nav a.add { background: var(--accent); color: var(--accent-ink); min-width: 52px; padding: 0; margin-left: 4px; }
    .bar-nav a.add svg { width: 22px; height: 22px; }

    /* sheet + toast */
    .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: in .15s; }
    .sheet { background: var(--raise); width: 100%; max-width: 520px; border-radius: 22px 22px 0 0; padding: 22px 20px calc(20px + var(--safe-b)); animation: up .22s cubic-bezier(.2,.8,.2,1); }
    .sheet h3 { margin: 0 0 6px; font-size: 19px; font-weight: 600; }
    .sheet p { margin: 0 0 20px; color: var(--text-2); font-size: 15px; }
    @keyframes up { from { transform: translateY(30px); opacity: .5; } }
    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + var(--safe-b)); background: var(--text); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; z-index: 60; max-width: calc(100% - 40px); }

    .card { background: var(--raise); border-radius: 18px; padding: 4px 16px; }
    .kv { display: flex; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
    .kv:last-child { border-bottom: 0; }
    .kv > span:first-child { color: var(--muted); }
    .pill { font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 999px; background: var(--raise-2); color: var(--text-2); }
    .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.good { color: var(--good); }

    @media (min-width: 900px) {
      main { padding-top: 48px; }
      .scrim { align-items: center; }
      .sheet { border-radius: 22px; }
    }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <nav class="bar-nav" id="nav" aria-label="Primary"></nav>
  <noscript>This app needs JavaScript.</noscript>
  <script src="ledger.js"></script>
  <script src="app.js"></script>
</body>
</html>
